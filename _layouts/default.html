<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14100b">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">К содержанию</a>

  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">
        {% include clew-mark.html size="header" %}
        <span class="site-title-text">{{ site.title }}</span>
      </a>
      <nav class="site-nav" aria-label="Основная навигация">
        <a href="{{ '/meetings/' | relative_url }}"{% if page.url contains '/meetings' %} aria-current="page"{% endif %}>Встречи</a>
        <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes' %} aria-current="page"{% endif %}>Заметки</a>
        <a href="{{ '/books/' | relative_url }}"{% if page.url contains '/books' %} aria-current="page"{% endif %}>Книги</a>
      </nav>
    </div>
  </header>

  <main id="content" class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Научный клуб в <a href="https://sandb0x.space/">sandbox</a></p>
      <p><a href="{{ '/feed.xml' | relative_url }}">лента</a></p>
    </div>
  </footer>
</body>
</html>
