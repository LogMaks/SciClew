<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,650;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">
        {% include clew-mark.html size="header" %}
        <span class="site-title-text">{{ site.title }}</span>
      </a>
      <nav class="site-nav" aria-label="Основная навигация">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Главная</a>
        <a href="{{ '/meetings/' | relative_url }}"{% if page.url contains '/meetings' %} aria-current="page"{% endif %}>Встречи</a>
        <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes' %} aria-current="page"{% endif %}>Заметки</a>
        <a href="{{ '/books/' | relative_url }}"{% if page.url contains '/books' %} aria-current="page"{% endif %}>Книги</a>
      </nav>
    </div>
  </header>

  <main class="wrap content reveal">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>{{ site.title }} — научный дискуссионный клуб</p>
    </div>
  </footer>
</body>
</html>
