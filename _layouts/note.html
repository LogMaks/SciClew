---
layout: default
---
<article class="note">
  <p class="meta">
    <a href="{{ '/notes/' | relative_url }}">← Заметки</a>
    {% if page.date %}
    · <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%d.%m.%Y' }}</time>
    {% endif %}
  </p>
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
