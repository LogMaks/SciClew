---
layout: default
---
<article class="meeting">
  <p class="meta">
    <a href="{{ '/meetings/' | relative_url }}">← Встречи</a>
    {% if page.date %}
    · <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%d.%m.%Y' }}</time>
    {% endif %}
  </p>
  <h1>{{ page.title }}</h1>
  {% if page.topic %}
  <p class="topic"><strong>Тема:</strong> {{ page.topic }}</p>
  {% endif %}
  {{ content }}
</article>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['\\[', '\\]']]
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
